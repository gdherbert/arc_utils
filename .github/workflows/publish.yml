name: Publish to PyPI

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        run: |
          python -c '
          import os
          import sys
          import tomllib

          if os.environ["GITHUB_REF_TYPE"] != "tag":
              sys.exit("Publishing requires a tag ref, including for manual runs.")
          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          expected_tag = "v" + version
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              sys.exit(f"Release tag {actual_tag!r} does not match package version {version!r}; expected {expected_tag!r}.")
          print(f"Release tag {actual_tag} matches package version {version}.")
          '

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arc-utils
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
